- aid: blink:blink-charging-locations-status-api
  name: Blink Charging Locations & Status API
  tags:
  - Charging Stations
  - Locations
  - Status
  - BlinkMap
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://prod.blinknetwork.com/developer.html
  baseURL: https://api.blinknetwork.com/map/v1
  properties:
  - url: https://prod.blinknetwork.com/developer.html
    type: Documentation
  - url: openapi/blink-charging-locations-status-openapi.yml
    type: OpenAPI
  description: Gated third-party integrator program (marketed as the BlinkMap API)
    returning Blink-compatible charging station locations, hours of operation, and
    live network status - station map pins reflect Available / Charging / Unavailable
    states. Signing up with Blink provides an API key plus technical reference and
    email support; a public self-serve API reference is not currently published.
    The endpoint shapes modeled here (geo-radius Locations search, name-based
    Search, and per-location Status lookup) come from a historical official Blink
    "API Map" PDF (dated January 2014) referenced by a long-standing third-party
    Ruby client library; current field names and paths are not independently
    re-verified against Blink's present-day version and should be confirmed with
    Blink directly before integration.
- aid: blink:blink-fleet-api
  name: Blink Fleet API
  tags:
  - Fleet
  - Sessions
  - Billing
  - Reservations
  - Partner Integration
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://blinkcharging.com/news/blink-and-presto-announce-strategic-collaboration-to-provide-advanced-tools-for-ev-fleet-charging
  baseURL: https://blinkcharging.com
  properties:
  - url: https://blinkcharging.com/news/blink-and-presto-announce-strategic-collaboration-to-provide-advanced-tools-for-ev-fleet-charging
    type: PressRelease
  - url: https://theevreport.com/blink-charging-partners-with-betterfleet-for-fleet-management
    type: PressRelease
  description: Blink Fleet is Blink's fleet-charging management platform for
    organizations running electric fleets (rental, ride-hail, delivery, government,
    transit). Blink states the portal "can be integrated into existing platforms
    via API," and partners including Presto (fleet roaming/payment) and BetterFleet
    (fleet SaaS) integrate driver charge-session discovery, charging, and payment
    through it. No technical base URL, authentication model, or endpoint reference
    is publicly published; access is brokered through Blink's partner program
    rather than open self-serve signup, so this entry is modeled at the product
    level (vehicles/drivers, charge sessions, billing/invoicing, reservations)
    rather than against confirmed endpoint paths.
- aid: blink:blink-ocpi-roaming-interface
  name: Blink Charging OCPI Roaming Interface
  tags:
  - OCPI
  - Roaming
  - eMSP
  - Hubject
  - Intercharge
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://blinkcharging.com/news/hubject-teams-with-blink-charging-to-further-expand-intercharge-network-across-north-america
  baseURL: https://blinkcharging.com
  properties:
  - url: https://blinkcharging.com/news/hubject-teams-with-blink-charging-to-further-expand-intercharge-network-across-north-america
    type: PressRelease
  - url: https://www.hubject.com/blog-posts/hubject-teams-with-blink-charging-to-further-expand-intercharge-network-across-north-america
    type: Documentation
  description: In September 2025 Blink joined Hubject's Intercharge eRoaming
    platform as a charge point operator (CPO), using the industry-standard Open
    Charge Point Interface (OCPI) protocol so partner e-mobility service providers
    (eMSPs) on Hubject's hub can discover Blink stations, authorize charging, and
    receive standardized OCPI-based billing/CDRs across the US, Canada, and Mexico.
    This is a B2B roaming interface brokered through Hubject rather than a direct
    self-serve developer API; Blink does not itself publish a public OCPI base
    URL, credential process, or version endpoint - integration happens through
    Hubject's platform-to-platform OCPI handshake.
