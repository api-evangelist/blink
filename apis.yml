name: Blink Charging
kind: company
description: Blink Charging Co. (Nasdaq BLNK) operates the Blink Network of Level
  2 and DC Fast electric vehicle chargers across North America and Europe, alongside
  brands acquired via SemaConnect, Blue Corner, BlueLA, and Envoy. Blink's charger
  hardware (Series 7/8/9) is OCPP 2.0.1 certified for CSMS interoperability, and in
  2025 Blink joined Hubject's Intercharge eRoaming platform as a charge point operator
  using the OCPI protocol so third-party e-mobility service providers can route
  drivers and billing to Blink stations. Blink also runs a gated BlinkMap API
  developer program (station locations, hours, and live network status) and a
  Blink Fleet platform that partners such as Presto and BetterFleet integrate with
  via API for fleet charging, sessions, and billing. None of these programs
  currently publish a full public self-serve API reference; access requires
  signing up directly with Blink.
